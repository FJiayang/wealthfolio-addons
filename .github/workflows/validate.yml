name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  addon-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:schema
      - run: pnpm test:derive
      - run: pnpm validate:addons
      - run: pnpm generate
      - run: git diff --exit-code

  official-addons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter swingfolio-addon test
      - run: pnpm type-check:official
      - run: pnpm bundle:official

  ant-fund-pdf-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ant-fund-pdf-import-addon type-check
      - run: pnpm --filter ant-fund-pdf-import-addon test
      - run: pnpm --filter ant-fund-pdf-import-addon bundle
      - run: pnpm --filter ant-fund-pdf-import-addon test:package
      - uses: actions/upload-artifact@v4
        with:
          name: ant-fund-pdf-import-addon
          path: local/ant-fund-pdf-import-addon/dist/*.zip
          if-no-files-found: error
